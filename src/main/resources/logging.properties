# Global minimum logging level.
.level = INFO

# Send log messages to a file instead of the console.
handlers = java.util.logging.FileHandler

# FileHandler configuration.
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = logs/bank.log
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Keep the text format short and readable:
# date time LEVEL: message
java.util.logging.SimpleFormatter.format = %1$tF %1$tT %4$s: %5$s%6$s%n

# Package-specific level for this project.
com.bank.level = INFO
